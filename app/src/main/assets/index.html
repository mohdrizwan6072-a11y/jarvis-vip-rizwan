<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS v3.3 Silent</title>
<style>
body { background: #020b14; color: #00e5ff; font-family: monospace; text-align: center; margin: 0; padding: 12px; }
h1 { font-size: 16px; letter-spacing: 2px; text-shadow: 0 0 10px #00e5ff; margin: 4px 0; }
#circle { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #00e5ff; margin: 12px auto; box-shadow: 0 0 20px #00e5ff; animation: pulse 2s infinite; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
@keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }
#status { font-size: 12px; margin: 6px; color: #76ff03; font-weight: bold; min-height: 18px; }
#reply { background: rgba(0,229,255,0.08); border: 1px solid #00e5ff; border-radius: 8px; padding: 8px; font-size: 12px; color: #fff; max-height: 90px; overflow-y: auto; text-align: left; }

.btn-power { width: 90%; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 20px; border: none; cursor: pointer; margin: 6px auto; display: block; }
.p-on { background: #00e5ff; color: #020b14; box-shadow: 0 0 15px #00e5ff; }
.p-off { background: #ff5252; color: #fff; box-shadow: 0 0 15px #ff5252; }

.box { background: #071727; border: 1px solid #00e5ff; border-radius: 8px; padding: 8px; margin-top: 8px; text-align: left; font-size: 11px; }
.btn-row { display: flex; justify-content: space-between; gap: 5px; margin: 6px 0; }
.btn { flex: 1; background: transparent; border: 1px solid #00e5ff; color: #00e5ff; padding: 5px 2px; border-radius: 5px; font-size: 11px; cursor: pointer; text-align: center; }
.slider-row { margin: 5px 0; display: flex; justify-content: space-between; align-items: center; }
.slider-row input { width: 50%; }
</style>
</head>
<body>
<h1>⚡ VIP RIZWAN AI (v3.3) ⚡</h1>

<button id="pBtn" class="btn-power p-on" onclick="togglePower()">🟢 ASSISTANT ON (Tap to Turn OFF)</button>

<div id="circle">JARVIS<br>SILENT MODE</div>
<div id="status">🤫 Shaant Hai... Sirf "Hey Jarvis" Par Bolunga</div>
<div id="reply">Jarvis is online. Say "Hey Jarvis" or "Hey Mayra" to talk.</div>

<div class="box">
  <b style="color:#00e5ff;">⚙️ Voice Tuning & Persona:</b>
  <div class="btn-row">
    <button class="btn" onclick="setPreset(0.7, 0.95, 'jarvis')">🤖 Deep Jarvis</button>
    <button class="btn" onclick="setPreset(1.35, 1.05, 'mayra')">👩 Mayra</button>
    <button class="btn" onclick="setPreset(1.0, 1.1, 'smart')">⚡ Smart</button>
  </div>
  <div class="slider-row">
    <span>Pitch (Mota/Patla):</span>
    <input type="range" id="pRange" min="0.5" max="1.6" step="0.05" oninput="updateSliders()">
  </div>
  <div class="slider-row">
    <span>Speed (Slow/Fast):</span>
    <input type="range" id="sRange" min="0.7" max="1.5" step="0.05" oninput="updateSliders()">
  </div>
  <div class="btn-row">
    <button class="btn" onclick="testSound()" style="background:#00e5ff;color:#000;font-weight:bold;">🔊 Test Aawaz</button>
    <button class="btn" onclick="resetKey()" style="border-color:#ff5252;color:#ff5252;">🔑 Reset Key</button>
  </div>
</div>

<script>
let isPowerOn = true;
let KEY = localStorage.getItem("jarvis_gemini_key") || "";
if (!KEY) {
    KEY = prompt("VIP Rizwan Sir, enter Gemini API Key:") || "";
    if (KEY) localStorage.setItem("jarvis_gemini_key", KEY.trim());
}

function resetKey() {
    let k = prompt("Enter new Gemini API Key:", KEY);
    if (k) { localStorage.setItem("jarvis_gemini_key", k.trim()); KEY = k.trim(); alert("Key Updated!"); }
}

let pitch = parseFloat(localStorage.getItem("j_pitch") || "0.7");
let rate = parseFloat(localStorage.getItem("j_rate") || "0.95");
let persona = localStorage.getItem("j_persona") || "jarvis";

document.getElementById("pRange").value = pitch;
document.getElementById("sRange").value = rate;

function updateSliders() {
    pitch = parseFloat(document.getElementById("pRange").value);
    rate = parseFloat(document.getElementById("sRange").value);
    localStorage.setItem("j_pitch", pitch);
    localStorage.setItem("j_rate", rate);
}

function setPreset(p, r, per) {
    pitch = p; rate = r; persona = per;
    document.getElementById("pRange").value = p;
    document.getElementById("sRange").value = r;
    updateSliders();
    localStorage.setItem("j_persona", per);
    testSound();
}

function speak(text) {
    if (!isPowerOn) return;
    let clean = text.replace(/[*#]/g, '').trim();
    if (window.Android && window.Android.speakOut) {
        window.Android.speakOut(clean, pitch, rate);
    }
}

function testSound() {
    let msg = persona === "mayra" ? "Rizwan jaan, Mayra ki aawaz ready hai!" : "VIP Rizwan Sir, Jarvis voice updated.";
    speak(msg);
}

function togglePower() {
    isPowerOn = !isPowerOn;
    const btn = document.getElementById("pBtn");
    if (isPowerOn) {
        btn.innerText = "🟢 ASSISTANT ON (Tap to Turn OFF)";
        btn.className = "btn-power p-on";
        statusDiv.innerText = "🤫 Shaant Hai... Sirf 'Hey Jarvis' Par Bolunga";
        startMic();
        speak("System online. Waiting for wake word.");
    } else {
        btn.innerText = "🔴 ASSISTANT OFF (Tap to Turn ON)";
        btn.className = "btn-power p-off";
        statusDiv.innerText = "🔴 System Muted / Off";
        if (recognition) { try { recognition.stop(); } catch(e){} }
        speak("Assistant muted.");
    }
}

const statusDiv = document.getElementById("status");
const replyDiv = document.getElementById("reply");

const MODELS = ["models/gemini-3.5-flash-lite", "models/gemini-3.8-flash", "models/gemini-2.5-flash"];

async function askAI(prompt) {
    if (!KEY) { replyDiv.innerText = "API Key missing!"; return; }
    statusDiv.innerText = "Thinking...";

    let sys = persona === "mayra" ?
      "You are MAYRA, caring loving girlfriend for Rizwan jaan. Sweet, cute, 1-2 sentence replies in Roman Urdu/Hindi." :
      "You are JARVIS for VIP Rizwan (Sir). Loyal, witty, brief 1-2 sentence voice reply in Roman Urdu/Hindi.";

    for (let model of MODELS) {
        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/${model}:generateContent?key=${KEY}`;
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `${sys}\\n\\nUser: ${prompt}` }] }],
                    generationConfig: { maxOutputTokens: 150 }
                })
            });
            const data = await res.json();
            if (data && data.candidates && data.candidates.length > 0 && data.candidates[0].content) {
                const ans = data.candidates[0].content.parts[0].text;
                replyDiv.innerText = ans;
                statusDiv.innerText = "🤫 Shaant... Sirf 'Hey Jarvis' boliye";
                speak(ans);
                return;
            }
        } catch(e) {}
    }
    let msg = "Sir, connection issue aaya. Please Key check kijiye.";
    replyDiv.innerText = msg;
    speak(msg);
    statusDiv.innerText = "Ready";
}

let recognition;
let isRestarting = false;

function startMic() {
    if (!recognition || !isPowerOn || isRestarting) return;
    try {
        if (window.Android && window.Android.muteBeep) { window.Android.muteBeep(true); }
        recognition.start();
    } catch(e) {}
}

if ("webkitSpeechRecognition" in window) {
    recognition = new webkitSpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = "hi-IN";

    recognition.onresult = function(e) {
        if (!isPowerOn) return;
        if (!e || !e.results || e.results.length === 0) return;
        const last = e.results[e.results.length - 1];
        if (!last || last.length === 0 || !last[0] || !last[0].transcript) return;
        
        const rawText = last[0].transcript.toLowerCase().trim();

        // STRICT WAKE-WORD FILTER
        const hasJarvis = rawText.includes("jarvis") || rawText.includes("service") || rawText.includes("charvis");
        const hasMayra = rawText.includes("mayra") || rawText.includes("myra");

        // AGAR WAKE-WORD NAHI BOLA, TOH BILKUL CHUP RAHO
        if (!hasJarvis && !hasMayra) {
            statusDiv.innerText = "🤫 Ignored (Sirf 'Hey Jarvis' boliye)";
            return;
        }

        statusDiv.innerText = "Heard: " + rawText;

        if (hasMayra) {
            setPreset(1.35, 1.05, "mayra");
        } else {
            setPreset(0.7, 0.95, "jarvis");
        }

        let cmd = rawText
            .replace(/hey\s*jarvis/g, "")
            .replace(/jarvis/g, "")
            .replace(/service/g, "")
            .replace(/hey\s*mayra/g, "")
            .replace(/mayra/g, "")
            .replace(/myra/g, "")
            .trim();

        if (!cmd) {
            let ack = persona === "mayra" ? "Rizwan jaan, main sun rahi hoon boliye." : "Yes VIP Rizwan Sir, I am listening.";
            replyDiv.innerText = ack;
            speak(ack);
            return;
        }

        if (cmd.includes("youtube") || cmd.includes("play") || cmd.includes("gaana") || cmd.includes("song")) {
            let q = cmd.replace("youtube","").replace("play","").replace("gaana","").replace("song","").trim() || "trending songs";
            if (window.Android) { window.Android.openUrl("https://www.youtube.com/results?search_query=" + encodeURIComponent(q)); }
            speak("Playing " + q + " on YouTube");
        } else if (cmd.includes("whatsapp")) {
            if (window.Android) { window.Android.openUrl("whatsapp://"); }
            speak("Opening WhatsApp");
        } else {
            askAI(cmd);
        }
    };

    // Clean Silent Restart without loop spam
    recognition.onend = function() {
        if (!isPowerOn) return;
        isRestarting = true;
        setTimeout(function() {
            isRestarting = false;
            startMic();
        }, 1200);
    };

    recognition.onerror = function() {
        if (!isPowerOn) return;
        isRestarting = true;
        setTimeout(function() {
            isRestarting = false;
            startMic();
        }, 1500);
    };

    startMic();
}

setTimeout(function() {
    speak("Jarvis is online and silent. Say Hey Jarvis to wake me up.");
}, 1200);
</script>
</body>
</html>
